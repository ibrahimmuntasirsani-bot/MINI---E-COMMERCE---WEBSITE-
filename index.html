<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini E-Commerce Store</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #111;
  color: white;
}

/* HEADER */
header {
  background: #1f1f1f;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

.product {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

.product img {
  width: 100%;
  border-radius: 10px;
}

button {
  background: green;
  border: none;
  padding: 10px;
  color: white;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background: darkgreen;
}

/* CART */
.cart {
  background: #1a1a1a;
  padding: 15px;
  margin: 20px;
  border-radius: 10px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  background: #333;
  padding: 10px;
  border-radius: 5px;
}

.remove {
  background: red;
  padding: 5px;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

.total {
  font-size: 18px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
🛒 Mini E-Commerce Store
</header>

<!-- PRODUCTS -->
<div class="products">

  <div class="product">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Phone</h3>
    <p>₦120,000</p>
    <button onclick="addToCart('Phone', 120000)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Shoes</h3>
    <p>₦25,000</p>
    <button onclick="addToCart('Shoes', 25000)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Laptop</h3>
    <p>₦450,000</p>
    <button onclick="addToCart('Laptop', 450000)">Add to Cart</button>
  </div>

</div>

<!-- CART -->
<div class="cart">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <div class="total">Total: ₦<span id="total">0</span></div>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({ name, price });
  total += price;
  renderCart();
}

function removeItem(index) {
  total -= cart[index].price;
  cart.splice(index, 1);
  renderCart();
}

function renderCart() {
  let cartDiv = document.getElementById("cartItems");
  cartDiv.innerHTML = "";

  cart.forEach((item, index) => {
    cartDiv.innerHTML += `
      <div class="cart-item">
        <span>${item.name} - ₦${item.price}</span>
        <button class="remove" onclick="removeItem(${index})">X</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
